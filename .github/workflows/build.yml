name: Build iOS IPA

on:
  push:
    branches: [ "main", "master", "fix/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPAs (iPhone & iPhone Duo)
    # GitHub's documented ARM64 image includes Xcode 27.1 and the iPhone Duo runtime.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Require Xcode 27.1 and the Duo SDK
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -E '^Xcode 27\.1([[:space:]]|$)'
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_VERSION="$SDK_VERSION" python3 - <<'PY'
          import os
          version = tuple(int(part) for part in os.environ['SDK_VERSION'].split('.'))
          assert version >= (27, 1), f'iOS 27.1 SDK required, found {version}'
          print('Duo-capable build SDK:', os.environ['SDK_VERSION'])
          PY

      - name: Install xcodegen if needed
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select real Duo and ordinary iPhone simulators
        run: |
          python3 scripts/test_select_ios_simulators.py
          xcrun simctl list devices available -j | python3 scripts/select_ios_simulators.py

      - name: Test full suite on iPhone Duo
        run: |
          xcodebuild test \
            -project LegadoReader.xcodeproj \
            -scheme LegadoReader \
            -destination "platform=iOS Simulator,id=$DUO_SIMULATOR_ID" \
            -only-testing:LegadoReaderTests \
            -parallel-testing-enabled NO \
            -derivedDataPath ./TestDerivedData \
            -resultBundlePath ./TestResults-Duo.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Test full suite on ordinary iPhone
        run: |
          xcodebuild test \
            -project LegadoReader.xcodeproj \
            -scheme LegadoReader \
            -destination "platform=iOS Simulator,id=$STANDARD_SIMULATOR_ID" \
            -only-testing:LegadoReaderTests \
            -parallel-testing-enabled NO \
            -derivedDataPath ./TestDerivedData \
            -resultBundlePath ./TestResults-iPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Test App source reset and undo on iPhone Duo
        run: |
          xcodebuild test \
            -project LegadoReader.xcodeproj \
            -scheme LegadoReader \
            -destination "platform=iOS Simulator,id=$DUO_SIMULATOR_ID" \
            -only-testing:LegadoReaderUITests \
            -parallel-testing-enabled NO \
            -derivedDataPath ./TestDerivedData \
            -resultBundlePath ./TestResults-UI-Duo.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Test App source reset and undo on ordinary iPhone
        run: |
          xcodebuild test \
            -project LegadoReader.xcodeproj \
            -scheme LegadoReader \
            -destination "platform=iOS Simulator,id=$STANDARD_SIMULATOR_ID" \
            -only-testing:LegadoReaderUITests \
            -parallel-testing-enabled NO \
            -derivedDataPath ./TestDerivedData \
            -resultBundlePath ./TestResults-UI-iPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-regression-test-results
          path: TestResults-*.xcresult
          retention-days: 7

      - name: Build Application with xcodebuild
        run: |
          xcodebuild clean build \
            -project LegadoReader.xcodeproj \
            -scheme LegadoReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Both Unsigned IPAs (Standard iPhone & iPhone Duo)
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products -name "LegadoReader.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LegadoReader.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          APP_PATH="$APP_PATH" python3 - <<'PY'
          import os, pathlib, plistlib, re
          info = plistlib.loads((pathlib.Path(os.environ['APP_PATH']) / 'Info.plist').read_bytes())
          sdk = info.get('DTSDKName', '')
          match = re.fullmatch(r'iphoneos(\d+)\.(\d+)(?:\.\d+)?', sdk)
          assert match and tuple(map(int, match.groups())) >= (27, 1), f'IPA built with wrong SDK: {sdk}'
          print('Packaged build SDK:', sdk)
          PY

          # 1. Package Standard iPhone Edition (LegadoReader-unsigned.ipa)
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 风读小说" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :IS_IPHONE_DUO_EDITION false" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" Payload/LegadoReader.app/Info.plist
          zip -r -q LegadoReader-unsigned.ipa Payload/
          ls -lh LegadoReader-unsigned.ipa

          # 2. Package iPhone Duo Foldable Edition (LegadoReader-iPhoneDuo-unsigned.ipa)
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName '风读小说 Duo'" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :IS_IPHONE_DUO_EDITION true" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen false" Payload/LegadoReader.app/Info.plist
          zip -r -q LegadoReader-iPhoneDuo-unsigned.ipa Payload/
          ls -lh LegadoReader-iPhoneDuo-unsigned.ipa

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: LegadoReader-unsigned-ipa
          path: |
            LegadoReader-unsigned.ipa
            LegadoReader-iPhoneDuo-unsigned.ipa
          retention-days: 30

  release:
    name: Publish GitHub Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Download packaged IPAs
        uses: actions/download-artifact@v8.0.2
        with:
          name: LegadoReader-unsigned-ipa
          path: release

      - name: Verify IPA version, edition and archive integrity
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, re, zipfile
          version = os.environ['TAG_NAME'].lstrip('v')
          expected = {'LegadoReader-unsigned.ipa': False, 'LegadoReader-iPhoneDuo-unsigned.ipa': True}
          for name, duo in expected.items():
              path = pathlib.Path('release') / name
              assert path.is_file() and path.stat().st_size > 1_000_000, name
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, name
                  info = plistlib.loads(archive.read('Payload/LegadoReader.app/Info.plist'))
                  assert info['CFBundleShortVersionString'] == version, (name, info['CFBundleShortVersionString'])
                  assert info['IS_IPHONE_DUO_EDITION'] == duo, (name, info['IS_IPHONE_DUO_EDITION'])
                  sdk = info.get('DTSDKName', '')
                  match = re.fullmatch(r'iphoneos(\d+)\.(\d+)(?:\.\d+)?', sdk)
                  assert match and tuple(map(int, match.groups())) >= (27, 1), (name, sdk)
                  print(name, info['CFBundleShortVersionString'], info['CFBundleVersion'], sdk)
          PY

      - name: Publish release with both IPAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "风读 $GITHUB_REF_NAME · iPhone & iPhone Duo" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            release/LegadoReader-unsigned.ipa \
            release/LegadoReader-iPhoneDuo-unsigned.ipa

      - name: Verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > release.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('release.json'))
          assert data['tagName'] == os.environ['TAG_NAME'], data['tagName']
          assert data['isDraft'] is False
          expected = sorted(['LegadoReader-unsigned.ipa', 'LegadoReader-iPhoneDuo-unsigned.ipa'])
          names = sorted(asset['name'] for asset in data['assets'])
          assert names == expected, names
          for asset in data['assets']:
              assert asset['size'] > 1_000_000, asset
          print('release verified:', data['tagName'], names)
          PY


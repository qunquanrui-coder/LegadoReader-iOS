name: Build iOS IPA

on:
  push:
    branches: [ "main", "master", "fix/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPAs (iPhone & iPhone Duo)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: xcodebuild -version

      - name: Install xcodegen if needed
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Test Chapter Integrity on iOS Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project LegadoReader.xcodeproj \
            -scheme LegadoReader \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath ./TestDerivedData \
            -resultBundlePath ./TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-integrity-test-results
          path: TestResults.xcresult
          retention-days: 7

      - name: Build Application with xcodebuild
        run: |
          xcodebuild clean build \
            -project LegadoReader.xcodeproj \
            -scheme LegadoReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Both Unsigned IPAs (Standard iPhone & iPhone Duo)
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products -name "LegadoReader.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LegadoReader.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # 1. Package Standard iPhone Edition (LegadoReader-unsigned.ipa)
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 风读小说" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :IS_IPHONE_DUO_EDITION false" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" Payload/LegadoReader.app/Info.plist
          zip -r -q LegadoReader-unsigned.ipa Payload/
          ls -lh LegadoReader-unsigned.ipa

          # 2. Package iPhone Duo Foldable Edition (LegadoReader-iPhoneDuo-unsigned.ipa)
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName '风读小说 Duo'" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :IS_IPHONE_DUO_EDITION true" Payload/LegadoReader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen false" Payload/LegadoReader.app/Info.plist
          zip -r -q LegadoReader-iPhoneDuo-unsigned.ipa Payload/
          ls -lh LegadoReader-iPhoneDuo-unsigned.ipa

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegadoReader-unsigned-ipa
          path: |
            LegadoReader-unsigned.ipa
            LegadoReader-iPhoneDuo-unsigned.ipa
          retention-days: 30

  release:
    name: Publish GitHub Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download packaged IPAs
        uses: actions/download-artifact@v4
        with:
          name: LegadoReader-unsigned-ipa
          path: release

      - name: Verify IPA version, edition and archive integrity
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, zipfile
          version = os.environ['TAG_NAME'].lstrip('v')
          expected = {'LegadoReader-unsigned.ipa': False, 'LegadoReader-iPhoneDuo-unsigned.ipa': True}
          for name, duo in expected.items():
              path = pathlib.Path('release') / name
              assert path.is_file() and path.stat().st_size > 1_000_000, name
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, name
                  info = plistlib.loads(archive.read('Payload/LegadoReader.app/Info.plist'))
                  assert info['CFBundleShortVersionString'] == version, (name, info['CFBundleShortVersionString'])
                  assert info['IS_IPHONE_DUO_EDITION'] == duo, (name, info['IS_IPHONE_DUO_EDITION'])
                  print(name, info['CFBundleShortVersionString'], info['CFBundleVersion'])
          PY

      - name: Publish release with both IPAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "风读 $GITHUB_REF_NAME · iPhone & iPhone Duo" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            release/LegadoReader-unsigned.ipa \
            release/LegadoReader-iPhoneDuo-unsigned.ipa

      - name: Verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > release.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('release.json'))
          assert data['tagName'] == os.environ['TAG_NAME'], data['tagName']
          assert data['isDraft'] is False
          expected = sorted(['LegadoReader-unsigned.ipa', 'LegadoReader-iPhoneDuo-unsigned.ipa'])
          names = sorted(asset['name'] for asset in data['assets'])
          assert names == expected, names
          for asset in data['assets']:
              assert asset['size'] > 1_000_000, asset
          print('release verified:', data['tagName'], names)
          PY

